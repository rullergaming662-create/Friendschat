
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FriendChat</title>

<style>
:root {
  --bg:#10141f;
  --panel:#171e30;
  --primary:#6577ff;
  --text:#edf1ff;
  --muted:#9aa6c2;
  --line:#293149;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,input { font:inherit; }
button { cursor:pointer; }

#app {
  max-width:1000px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  background:var(--primary);
  padding:16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand { font-size:22px;font-weight:bold; }
.sub { font-size:13px; }

.card {
  width:min(92%,430px);
  margin:35px auto;
  padding:24px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
}

input {
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0e1422;
  color:white;
}

button {
  border:0;
  border-radius:10px;
  padding:12px;
}

.primary {
  background:var(--primary);
  color:white;
  font-weight:bold;
}

.secondary {
  background:#27314b;
  color:white;
}

.full { width:100%;margin-top:10px; }

.error {
  color:#ff7070;
  font-size:14px;
  margin-top:10px;
  overflow-wrap:anywhere;
}

#workspace {
  flex:1;
  display:flex;
  flex-direction:column;
}

#main {
  flex:1;
  display:flex;
  min-height:0;
}

.sidebar {
  width:300px;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}

.me {
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.search { padding:10px; }

.user-list {
  overflow:auto;
  flex:1;
}

.person {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  padding:13px;
  color:white;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.person.active { background:#27314b; }

.avatar {
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--primary);
  display:grid;
  place-items:center;
  font-weight:bold;
}

.chat {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-head {
  padding:12px;
  background:var(--panel);
  display:flex;
  align-items:center;
  gap:10px;
}

.messages {
  flex:1;
  min-height:250px;
  overflow:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.bubble {
  max-width:80%;
  background:#20283b;
  padding:10px;
  border-radius:12px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.mine {
  align-self:flex-end;
  background:#29385a;
}

.theirs { align-self:flex-start; }

.time {
  font-size:10px;
  color:var(--muted);
  text-align:right;
  margin-top:5px;
}

.composer {
  display:flex;
  gap:8px;
  padding:10px;
  background:var(--panel);
}

.composer input { flex:1;min-width:0; }

.empty {
  text-align:center;
  padding:25px;
  color:var(--muted);
}

.hidden { display:none!important; }

@media(max-width:650px) {
  #main { position:relative; }
  .sidebar { width:100%; }
  .chat {
    display:none;
    position:absolute;
    inset:0;
    background:var(--bg);
  }
  .sidebar.chat-open { display:none; }
  .chat.chat-open { display:flex; }
}
</style>
</head>

<body>

<div id="app">

<section id="auth">

<header>
  <div>
    <div class="brand">◉ FriendChat</div>
    <div class="sub">Private chats with your friends</div>
  </div>
</header>

<div class="card">
  <h2>Welcome 👋</h2>
  <p>Create an account or sign in to chat with friends.</p>

  <form id="authForm">
    <input id="displayName"
      placeholder="Your name (for new account)"
      autocomplete="name">

    <input id="email"
      type="email"
      placeholder="Email address"
      required>

    <input id="password"
      type="password"
      placeholder="Password (minimum 6 characters)"
      minlength="6"
      required>

    <button class="primary full" type="submit">
      Sign in
    </button>

    <button class="secondary full" id="signupBtn" type="button">
      Create new account
    </button>

    <div id="authError" class="error"></div>
  </form>
</div>

</section>

<section id="workspace" class="hidden">

<header>
  <div style="flex:1">
    <div class="brand">◉ FriendChat</div>
    <div class="sub">Private chats with your friends</div>
  </div>

  <button id="logoutBtn" class="secondary">
    Sign out
  </button>
</header>

<div id="main">

<aside id="sidebar" class="sidebar">

<div class="me">
  <div class="avatar" id="myAvatar">Y</div>
  <div id="myName">You</div>
  <button id="refreshUsers" class="secondary">↻</button>
</div>

<div class="search">
  <input id="searchUsers"
    placeholder="Search friend by name">
</div>

<div id="userList" class="user-list">
  <div class="empty">Search a friend by name.</div>
</div>

</aside>

<section id="chatPanel" class="chat">

<div id="chatEmpty" class="empty">
  <h2>💬 Start a conversation</h2>
  <p>Select a friend from the contacts list.</p>
</div>

<div id="activeChat" class="hidden"
  style="flex:1;min-height:0;display:flex;flex-direction:column">

<div class="chat-head">
  <button id="backBtn" class="secondary">‹</button>
  <div class="avatar" id="friendAvatar">F</div>
  <div id="friendName">Friend</div>
</div>

<div id="messages" class="messages"></div>

<form id="messageForm" class="composer">
  <input id="messageInput"
    type="text"
    maxlength="4000"
    placeholder="Type a message..."
    autocomplete="off"
    required>

  <button class="primary" type="submit">➤</button>
</form>

</div>

</section>
</div>
</section>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDocs,
  getDoc,
  query,
  orderBy,
  addDoc,
  onSnapshot,
  serverTimestamp,
  updateDoc,
  runTransaction
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

/* Firebase configuration */
const firebaseConfig = {
  apiKey: "AIzaSyDhlMfrjMUgPTV4FUQeFqxPstXS4x9Wt0c",
  authDomain: "friendschat-6d805.firebaseapp.com",
  projectId: "friendschat-6d805",
  storageBucket: "friendschat-6d805.firebasestorage.app",
  messagingSenderId: "572525903948",
  appId: "1:572525903948:web:d0fab69128b9dfe1a0f4e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let selectedUser = null;
let allUsers = [];

let unsubscribeMessages = null;
let unsubscribeFriend = null;

const authSection = $("auth");
const workspace = $("workspace");

function showError(message) {
  $("authError").textContent = message;
}

function friendlyError(err) {
  const messages = {
    "auth/email-already-in-use":
      "This email already has an account. Sign in instead.",

    "auth/invalid-credential":
      "Email or password is incorrect.",

    "auth/weak-password":
      "Password must contain at least 6 characters.",

    "auth/invalid-email":
      "Enter a valid email address.",

    "auth/network-request-failed":
      "Network error. Check your internet connection.",

    "permission-denied":
      "Firestore permission denied. Please check your Rules.",

    "auth/operation-not-allowed":
      "Enable Email/Password sign-in in Firebase Authentication."
  };

  return messages[err.code] ||
    err.message ||
    "Something went wrong.";
}

function conversationId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

/* Save user profile */
async function saveProfile(user, name) {
  await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    name: name,
    updatedAt: serverTimestamp()
  }, { merge:true });
}

/* Authentication */
onAuthStateChanged(auth, async user => {
  currentUser = user;

  authSection.classList.toggle("hidden", !!user);
  workspace.classList.toggle("hidden", !user);

  if (user) {
    $("myName").textContent =
      user.displayName || user.email;

    $("myAvatar").textContent =
      (user.displayName || user.email || "Y")
      .charAt(0).toUpperCase();

    try {
      await saveProfile(
        user,
        user.displayName || user.email.split("@")[0]
      );

      await loadUsers();
    } catch (err) {
      showError(friendlyError(err));
    }
  } else {
    cleanupChat();
  }
});

/* Sign in */
$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  showError("");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  } catch (err) {
    showError(friendlyError(err));
  }
});

/* Create account */
$("signupBtn").addEventListener("click", async () => {
  showError("");

  const name = $("displayName").value.trim()
    .replace(/\s+/g, " ");

  const email = $("email").value.trim();
  const password = $("password").value;

  if (name.length < 2) {
    showError("Enter a name with at least 2 characters.");
    return;
  }

  if (!email || password.length < 6) {
    showError("Enter email and password (minimum 6 characters).");
    return;
  }

  const nameKey = name.toLowerCase();

  let credential;

  try {
    /*
     * Create Firebase Auth account FIRST.
     * Then reserve username and create profile.
     */
    credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await updateProfile(credential.user, {
      displayName: name
    });

    const nameRef = doc(db, "usernames", nameKey);

    await runTransaction(db, async transaction => {
      const existing = await transaction.get(nameRef);

      if (existing.exists()) {
        throw new Error("NAME_TAKEN");
      }

      transaction.set(nameRef, {
        uid: credential.user.uid,
        name: name
      });
    });

    await saveProfile(credential.user, name);

    showError("");

  } catch (err) {
    if (err.message === "NAME_TAKEN") {
      showError("This name is already registered.");
    } else {
      showError(friendlyError(err));
    }
  }
});

/* Logout */
$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

/* Load registered users */
async function loadUsers() {
  if (!currentUser) return;

  try {
    const snapshot = await getDocs(
      collection(db, "users")
    );

    allUsers = snapshot.docs
      .map(d => d.data())
      .filter(u =>
        u.uid &&
        u.uid !== currentUser.uid &&
        u.name
      );

    renderUsers();

  } catch (err) {
    $("userList").innerHTML =
      `<div class="empty">${friendlyError(err)}</div>`;
  }
}

$("refreshUsers").addEventListener("click", loadUsers);

$("searchUsers").addEventListener("input", renderUsers);

/* Search and render friends */
function renderUsers() {
  const term = $("searchUsers").value
    .trim()
    .toLowerCase();

  $("userList").innerHTML = "";

  if (!term) {
    $("userList").innerHTML =
      '<div class="empty">Type a friend name to search.</div>';
    return;
  }

  const filtered = allUsers.filter(u =>
    (u.name || "").toLowerCase().includes(term)
  );

  if (!filtered.length) {
    $("userList").innerHTML =
      '<div class="empty">No matching users found.</div>';
    return;
  }

  filtered.sort((a,b) =>
    a.name.localeCompare(b.name)
  );

  filtered.forEach(u => {
    const button = document.createElement("button");

    button.className = "person";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = u.name.charAt(0).toUpperCase();

    const name = document.createElement("div");
    name.textContent = u.name;

    button.append(avatar, name);

    button.addEventListener("click", () => openChat(u));

    $("userList").appendChild(button);
  });
}

/* Cleanup previous chat listeners */
function cleanupChat() {
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeFriend) unsubscribeFriend();

  unsubscribeMessages = null;
  unsubscribeFriend = null;
  selectedUser = null;
}

/* Open conversation */
function openChat(friend) {
  selectedUser = friend;

  $("chatEmpty").classList.add("hidden");
  $("activeChat").classList.remove("hidden");

  $("friendName").textContent = friend.name;

  $("friendAvatar").textContent =
    friend.name.charAt(0).toUpperCase();

  $("sidebar").classList.add("chat-open");
  $("chatPanel").classList.add("chat-open");

  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeFriend) unsubscribeFriend();

  const chatId = conversationId(
    currentUser.uid,
    friend.uid
  );

  const messagesQuery = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(
    messagesQuery,
    snapshot => {
      $("messages").innerHTML = "";

      snapshot.forEach(item => {
        const message = item.data();

        const bubble = document.createElement("div");

        bubble.className =
          "bubble " +
          (message.senderId === currentUser.uid
            ? "mine"
            : "theirs");

        const text = document.createElement("div");
        text.textContent = message.text || "";

        bubble.appendChild(text);

        const time = document.createElement("div");
        time.className = "time";

        time.textContent =
          message.createdAt?.toDate
            ? message.createdAt.toDate()
                .toLocaleTimeString([], {
                  hour:"2-digit",
                  minute:"2-digit"
                })
            : "Sending...";

        if (message.senderId === currentUser.uid) {
          const tick = document.createElement("span");

          tick.textContent =
            message.readAt ? " ✓✓" : " ✓";

          tick.style.color =
            message.readAt ? "#53b7ff" : "#9aa6c2";

          time.appendChild(tick);
        }

        bubble.appendChild(time);
        $("messages").appendChild(bubble);

        /*
         * Mark received messages as read.
         */
        if (
          message.senderId !== currentUser.uid &&
          message.receiverId === currentUser.uid &&
          !message.readAt
        ) {
          updateDoc(
            doc(db, "chats", chatId, "messages", item.id),
            { readAt: serverTimestamp() }
          ).catch(console.error);
        }
      });

      $("messages").scrollTop =
        $("messages").scrollHeight;
    },
    err => {
      $("messages").innerHTML =
        `<div class="empty">${friendlyError(err)}</div>`;
    }
  );
}

/* Back to contacts on mobile */
$("backBtn").addEventListener("click", () => {
  $("sidebar").classList.remove("chat-open");
  $("chatPanel").classList.remove("chat-open");
});

/* Send message */
$("messageForm").addEventListener("submit", async e => {
  e.preventDefault();

  const text = $("messageInput").value.trim();

  if (!text || !currentUser || !selectedUser) {
    return;
  }

  const chatId = conversationId(
    currentUser.uid,
    selectedUser.uid
  );

  $("messageInput").value = "";

  try {
    await addDoc(
      collection(db, "chats", chatId, "messages"),
      {
        type:"text",
        text:text,
        senderId:currentUser.uid,
        receiverId:selectedUser.uid,
        createdAt:serverTimestamp(),
        readAt:null
      }
    );

  } catch (err) {
    alert("Message send nahi hua: " + friendlyError(err));
    $("messageInput").value = text;
  }
});

</script>

</body>
</html>
